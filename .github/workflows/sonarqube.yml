name: Responsible CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Code quality with SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build --if-present
      - run: npm test --if-present

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  eco-budget:
    name: Eco/performance budget
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build --if-present

      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Add Lighthouse report link
        if: always()
        run: |
          links='${{ steps.lighthouse.outputs.links }}'
          if [ -z "$links" ] || [ "$links" = "null" ]; then
            echo "No Lighthouse public report link found" >&2
            exit 1
          fi
          {
            echo "### Lighthouse"
            echo ""
            echo "$links" | node -e "
              const fs = require('fs');
              const links = JSON.parse(fs.readFileSync(0, 'utf8'));
              for (const [url, report] of Object.entries(links)) {
                console.log('- [' + url + '](' + report + ')');
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"
